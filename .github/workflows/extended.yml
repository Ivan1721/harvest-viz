name: Pruebas extendidas
# Lo que es demasiado lento para cada PR: corre cada lunes y a demanda.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extended
  cancel-in-progress: false
jobs:
  model:
    name: Regresión completa, property-based y fuzzing intensivos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run test:full
        env:
          PBT_RUNS: 500
          PBT_SEED: ${{ github.run_id }}
          FUZZ_RUNS: 5000
      - name: Benchmark y sensibilidad
        shell: bash
        run: |
          set -o pipefail
          npm run bench | tee bench.txt
          npm run sensitivity -- --out sensibilidad.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analisis
          path: |
            bench.txt
            sensibilidad.md

  browsers:
    name: Interfaz en Chromium, Firefox y WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npm run test:e2e:all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-browsers
          path: playwright-report
          retention-days: 14

  visual:
    name: Regresión visual
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # las referencias se generaron en otro Linux: diferencias de fuentes pueden dar falsos positivos
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-visual
          path: playwright-report
          retention-days: 14

  mutation:
    name: Pruebas de mutación (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            reports/stryker-incremental.json
            reports/stryker-engine-incremental.json
          key: stryker-${{ github.sha }}
          restore-keys: stryker-
      - run: npm run test:mutation
      - run: npm run test:mutation:engine # motor con el oráculo corto (tests/mutation): ~15 min
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-report
          path: |
            reports/mutation
            reports/mutation-engine
