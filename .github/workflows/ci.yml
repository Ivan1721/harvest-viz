name: CI
on:
  pull_request:
  push:
    branches-ignore: [main] # main ya corre el despliegue (que vuelve a probar)
  workflow_dispatch:
jobs:
  checks:
    name: Lint, formato, pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage # modelo, datos, rendimiento + umbral de cobertura
      - run: npm run test:components
      - run: npm run build

  e2e:
    name: Interfaz (Playwright, Chromium) + accesibilidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
