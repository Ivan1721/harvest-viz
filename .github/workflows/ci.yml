name: CI
# PR: lint, pruebas, cobertura, componentes, build y E2E. Push a main: lo mismo y, si todo pasa, despliega a Pages.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # en un PR, un push nuevo cancela la corrida anterior; en main no (no cortar un despliegue)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Lint, formato, pruebas y cobertura
    # runner fijo: con ubuntu-latest, que migra a Ubuntu 26 desde el 19-10-2026, instalar las dependencias de
    # Chromium pasó de 13 s a 12 min y el job de interfaz superó su límite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage # modelo, datos, rendimiento + umbral de cobertura (.c8rc.json)
      - run: npm run test:components
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  e2e:
    name: Interfaz (Playwright, Chromium) + accesibilidad
    runs-on: ubuntu-24.04
    # imagen oficial de Playwright con Chromium y sus dependencias ya instaladas: sin apt, que en la migración de los
    # runners a Ubuntu 26 llegó a tardar 10–12 min. La etiqueta debe coincidir con @playwright/test (lo revisa
    # tests/unit/ci.test.mjs); el digest fija la imagen como el SHA fija las acciones.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    # Playwright con WebGL por software: ~14 min de pruebas
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Despliegue a GitHub Pages
    # solo si pasan todas las pruebas, incluidas las de interfaz
    needs: [checks, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
