name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Correr la regresión completa (720 configuraciones de MATLAB)'
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
        if: ${{ !inputs.full }}
      - run: npm run test:full
        if: ${{ inputs.full }}
      - run: npm run build
