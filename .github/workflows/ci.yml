name: CI
# PR: lint, pruebas, cobertura, componentes, build y E2E. Push a main: lo mismo y, si todo pasa, despliega a Pages.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # en un PR, un push nuevo cancela la corrida anterior; en main no (no cortar un despliegue)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Lint, formato, pruebas y cobertura
    # runner fijo: con ubuntu-latest, que migra a Ubuntu 26 desde el 19-10-2026, instalar las dependencias de
    # Chromium pasó de 13 s a 12 min y el job de interfaz superó su límite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage # modelo, datos, rendimiento + umbral de cobertura (.c8rc.json)
      - run: npm run test:components
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  e2e:
    name: Interfaz (Playwright, Chromium) + accesibilidad
    runs-on: ubuntu-24.04
    # Playwright con WebGL por software: ~14 min de pruebas, más instalar las dependencias de Chromium
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Despliegue a GitHub Pages
    # solo si pasan todas las pruebas, incluidas las de interfaz
    needs: [checks, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
