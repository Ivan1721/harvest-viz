version: 2
updates:
  # acciones de GitHub (fijadas por SHA): un PR mensual agrupado
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  # dependencias npm: parches y menores agrupados; las mayores (three, R3F, React…) por separado
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # las versiones mayores (React 19, R3F 9, drei 10, Vite 7+, ESLint 10…) se migran juntas a mano (tanda 8 de la auditoría)
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
